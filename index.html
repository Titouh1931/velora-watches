<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELORA Montres</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f5f5;
    color:#111;
}

header{
    background:#080808;
    text-align:center;
    padding:20px;
    color:white;
}

.logo{
    width:150px;
    max-width:50%;
    margin-bottom:8px;
}

header h1{
    font-size:25px;
    letter-spacing:2px;
}

header p{
    color:#d4af37;
    margin-top:6px;
}

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:35px 15px;
}

.hero h2{
    font-size:27px;
    margin-bottom:10px;
}

.hero p{
    color:#ddd;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product img{
    width:100%;
    height:300px;
    object-fit:contain;
    background:white;
}

.product h3{
    margin:15px 0 7px;
    font-size:22px;
}

.category{
    color:#777;
    margin-bottom:8px;
}

.price{
    font-size:23px;
    font-weight:bold;
    margin:10px 0;
}

button{
    border:0;
    background:#111;
    color:white;
    padding:13px 25px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    width:100%;
}

.order{
    display:none;
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.order h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:13px;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    background:white;
}

.cod{
    background:#f2f2f2;
    padding:15px;
    border-radius:8px;
    margin:18px 0;
    text-align:center;
}

footer{
    background:#080808;
    color:#aaa;
    text-align:center;
    padding:22px;
    margin-top:40px;
}

@media(max-width:600px){
    .product img{
        height:260px;
    }
}
</style>
</head>

<body>

<header>

<img src="logo.png" class="logo" alt="VELORA Montres">

<h1>VELORA MONTRES</h1>

<p>الأناقة في كل لحظة</p>

</header>


<section class="hero">

<h2>اكتشف مجموعتنا من الساعات</h2>

<p>ساعات رجالية ونسائية بأناقة مميزة وأسعار مناسبة</p>

</section>


<div class="container">

<h2 class="title">ساعاتنا</h2>

<div class="products">

<div class="product">

<img src="DZ2237_00QQQ_01_F.jpg" alt="WATCH">

<h3>WATCH</h3>

<div class="category">
ساعة رجالية
</div>

<div class="price">
2 600 دج
</div>

<button onclick="commander('WATCH','2600')">
اطلب الآن
</button>

</div>

</div>


<div class="order" id="order">

<h2>إتمام الطلب</h2>

<form onsubmit="envoyerCommande(event)">

<label>المنتج</label>

<input id="produit" readonly>


<label>الاسم واللقب</label>

<input id="nom" required placeholder="أدخل الاسم واللقب">


<label>رقم الهاتف</label>

<input id="telephone" type="tel" required placeholder="مثال: 0550000000">


<label>الولاية</label>

<select id="wilaya" required>

<option value="">اختر الولاية</option>

<option>01 - أدرار</option>
<option>02 - الشلف</option>
<option>03 - الأغواط</option>
<option>04 - أم البواقي</option>
<option>05 - باتنة</option>
<option>06 - بجاية</option>
<option>07 - بسكرة</option>
<option>08 - بشار</option>
<option>09 - البليدة</option>
<option>10 - البويرة</option>
<option>11 - تمنراست</option>
<option>12 - تبسة</option>
<option>13 - تلمسان</option>
<option>14 - تيارت</option>
<option>15 - تيزي وزو</option>
<option>16 - الجزائر</option>
<option>17 - الجلفة</option>
<option>18 - جيجل</option>
<option>19 - سطيف</option>
<option>20 - سعيدة</option>
<option>21 - سكيكدة</option>
<option>22 - سيدي بلعباس</option>
<option>23 - عنابة</option>
<option>24 - قالمة</option>
<option>25 - قسنطينة</option>
<option>26 - المدية</option>
<option>27 - مستغانم</option>
<option>28 - المسيلة</option>
<option>29 - معسكر</option>
<option>30 - ورقلة</option>
<option>31 - وهران</option>
<option>32 - البيض</option>
<option>33 - إليزي</option>
<option>34 - برج بوعريريج</option>
<option>35 - بومرداس</option>
<option>36 - الطارف</option>
<option>37 - تندوف</option>
<option>38 - تيسمسيلت</option>
<option>39 - الوادي</option>
<option>40 - خنشلة</option>
<option>41 - سوق أهراس</option>
<option>42 - تيبازة</option>
<option>43 - ميلة</option>
<option>44 - عين الدفلى</option>
<option>45 - النعامة</option>
<option>46 - عين تموشنت</option>
<option>47 - غرداية</option>
<option>48 - غليزان</option>
<option>49 - تيميمون</option>
<option>50 - برج باجي مختار</option>
<option>51 - أولاد جلال</option>
<option>52 - بني عباس</option>
<option>53 - عين صالح</option>
<option>54 - عين قزام</option>
<option>55 - تقرت</option>
<option>56 - جانت</option>
<option>57 - المغير</option>
<option>58 - المنيعة</option>

</select>


<label>البلدية والعنوان</label>

<input id="adresse" required placeholder="اكتب البلدية والعنوان">


<div class="cod">

💵 طريقة الدفع<br>

<strong>الدفع عند الاستلام</strong>

</div>


<button type="submit">
تأكيد الطلب
</button>

</form>

</div>

</div>


<footer>

VELORA Montres © 2026<br><br>

الدفع عند الاستلام 🇩🇿

</footer>


<script>

function commander(produit,prix){

document.getElementById("produit").value =
produit+" - "+prix+" دج";

document.getElementById("order").style.display="block";

document.getElementById("order").scrollIntoView({
behavior:"smooth"
});

}


function envoyerCommande(event){

event.preventDefault();

let nom=document.getElementById("nom").value;
let telephone=document.getElementById("telephone").value;
let wilaya=document.getElementById("wilaya").value;
let adresse=document.getElementById("adresse").value;

alert(
"تم تسجيل معلومات الطلب ✅\n\n"+
"الاسم: "+nom+
"\nالهاتف: "+telephone+
"\nالولاية: "+wilaya+
"\nالعنوان: "+adresse+
"\n\nالدفع عند الاستلام"
);

}

</script>

</body>
</html>
